<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — kiki.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .messages-page { display:grid; grid-template-columns:320px 1fr; height:calc(100vh - var(--header-h)); padding-top:var(--header-h); }
    .conversations-panel { background:var(--bg-2); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .conv-header { padding:20px; border-bottom:1px solid var(--border); }
    .conv-header h2 { font-size:1.1rem; font-weight:700; margin-bottom:12px; }
    .conv-search { position:relative; }
    .conv-search input { width:100%; background:var(--bg-3); border:1px solid var(--border); border-radius:var(--radius-pill); padding:8px 16px 8px 36px; color:var(--text); font-size:0.85rem; }
    .conv-search svg { position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim); }
    .conv-list { overflow-y:auto; flex:1; }
    .conv-item { display:flex; align-items:center; gap:12px; padding:14px 20px; cursor:pointer; transition:var(--transition); border-bottom:1px solid var(--border); }
    .conv-item:hover,.conv-item.active { background:var(--bg-3); }
    .conv-avatar { width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;position:relative; }
    .conv-online-dot { position:absolute;bottom:0;right:0;width:12px;height:12px;background:#4ade80;border-radius:50%;border:2px solid var(--bg-2); }
    .conv-avatar-wrap { position:relative;flex-shrink:0; }
    .conv-info { flex:1; min-width:0; }
    .conv-name { font-size:0.9rem; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
    .conv-time { font-size:0.72rem; color:var(--text-dim); }
    .conv-preview { font-size:0.8rem; color:var(--text-muted); overflow:hidden;text-overflow:ellipsis;white-space:nowrap; margin-top:2px; }
    .conv-unread { background:var(--red);color:#fff;border-radius:var(--radius-pill);padding:2px 7px;font-size:0.68rem;font-weight:700;margin-left:auto; }

    .chat-panel { display:flex; flex-direction:column; background:var(--bg); }
    .chat-header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; background:var(--bg-2); }
    .chat-header-avatar { width:40px;height:40px;border-radius:50%;object-fit:cover; }
    .chat-header-name { font-size:1rem;font-weight:700; }
    .chat-header-status { font-size:0.78rem;color:#4ade80;display:flex;align-items:center;gap:4px; }
    .chat-header-actions { margin-left:auto;display:flex;gap:8px; }
    .chat-icon-btn { padding:8px;border-radius:var(--radius-sm);color:var(--text-muted);transition:var(--transition); }
    .chat-icon-btn:hover { background:var(--bg-3);color:var(--text); }

    .chat-messages { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
    .chat-date-sep { text-align:center; font-size:0.72rem; color:var(--text-dim); position:relative; margin:8px 0; }
    .chat-date-sep::before,.chat-date-sep::after { content:'';position:absolute;top:50%;width:calc(50% - 40px);height:1px;background:var(--border); }
    .chat-date-sep::before{left:0;} .chat-date-sep::after{right:0;}
    .message { display:flex; gap:10px; max-width:70%; }
    .message.sent { align-self:flex-end; flex-direction:row-reverse; }
    .msg-avatar { width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0; }
    .msg-bubble { padding:12px 16px; border-radius:16px; font-size:0.875rem; line-height:1.5; }
    .message.received .msg-bubble { background:var(--bg-2); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .message.sent .msg-bubble { background:var(--red); color:#fff; border-bottom-right-radius:4px; }
    .msg-time { font-size:0.68rem;color:var(--text-dim);margin-top:4px;text-align:right; }
    .message.received .msg-time { text-align:left; }

    .chat-input-area { padding:20px 24px; border-top:1px solid var(--border); background:var(--bg-2); }
    .chat-input-row { display:flex; gap:10px; align-items:flex-end; }
    .chat-textarea { flex:1; background:var(--bg-3); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; color:var(--text); font-size:0.9rem; resize:none; min-height:44px; max-height:120px; transition:var(--transition); }
    .chat-textarea:focus { border-color:var(--red); }
    .chat-send-btn { padding:12px 20px; border-radius:var(--radius-pill); background:var(--red); color:#fff; font-weight:700; font-size:0.875rem; display:flex;align-items:center;gap:6px;transition:var(--transition);flex-shrink:0; }
    .chat-send-btn:hover { background:var(--red-dark); }
    .chat-empty { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:12px;padding:48px; }
    .chat-empty svg { opacity:0.3; }

    @media(max-width:700px){ .messages-page{grid-template-columns:1fr;} .conversations-panel{display:none;} }
  </style>
</head>
<body>
  <div id="header-mount"></div>
  <div class="messages-page">
    <!-- Conversations list -->
    <div class="conversations-panel">
      <div class="conv-header">
        <h2>Messages</h2>
        <div class="conv-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search conversations…">
        </div>
      </div>
      <div class="conv-list" id="conv-list"></div>
    </div>

    <!-- Chat area -->
    <div class="chat-panel" id="chat-panel">
      <div class="chat-empty" id="chat-empty">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <h3>Select a conversation</h3>
        <p>Choose a conversation from the left to start chatting.</p>
      </div>
      <div id="chat-active" style="display:none;flex-direction:column;height:100%;overflow:hidden;">
        <div class="chat-header" id="chat-header"></div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
          <div class="chat-input-row">
            <textarea class="chat-textarea" id="chat-input" placeholder="Type a message…" rows="1"></textarea>
            <button class="chat-send-btn" id="chat-send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('header-mount').innerHTML = renderHeader();
      initHeader(); initAgeGate(); initCookieBanner();

      const conversations = [
        { id: 1, profile: PROFILES[0], lastMsg: "Hi, are you available this Friday evening?", time: "2m ago", unread: 2, messages: [
          { sent: false, text: "Hi! I saw your listing and I'm very interested. Are you available this Friday evening?", time: "14:32" },
          { sent: true, text: "Hello! Yes, I'm available on Friday from 7pm onwards. What did you have in mind?", time: "14:45" },
          { sent: false, text: "A dinner date and then some private time. What are your rates?", time: "14:47" },
          { sent: true, text: "For a dinner date + private evening, I typically arrange a 3h package. Please check my profile for detailed rates.", time: "14:52" },
          { sent: false, text: "Perfect, I'll check and get back to you!", time: "15:00" },
        ]},
        { id: 2, profile: PROFILES[4], lastMsg: "Thank you for your message!", time: "1h ago", unread: 0, messages: [
          { sent: false, text: "Hello! I'd love to book you for next weekend.", time: "11:20" },
          { sent: true, text: "Thank you for your message! I'm checking my schedule for next weekend.", time: "12:05" },
          { sent: true, text: "I have Saturday evening available. What time were you thinking?", time: "12:06" },
        ]},
        { id: 3, profile: PROFILES[7], lastMsg: "Looking forward to meeting you!", time: "Yesterday", unread: 1, messages: [
          { sent: false, text: "Hello! I was wondering if you're available next week?", time: "Yesterday 18:30" },
          { sent: true, text: "Looking forward to meeting you! I have Monday and Thursday free next week.", time: "Yesterday 19:15" },
        ]},
        { id: 4, profile: PROFILES[11], lastMsg: "Please call me on the number in my profile.", time: "2d ago", unread: 0, messages: [
          { sent: false, text: "Hi Marine, would you be available for a 2-hour dinner date?", time: "2d ago" },
          { sent: true, text: "Hello! Of course. Please call me on the number in my profile so we can arrange details.", time: "2d ago" },
        ]},
      ];

      let activeConvId = null;

      function renderConversations() {
        const list = document.getElementById('conv-list');
        list.innerHTML = conversations.map(conv => `
          <div class="conv-item${conv.id === activeConvId ? ' active' : ''}" onclick="openConversation(${conv.id})">
            <div class="conv-avatar-wrap">
              <img src="${conv.profile.primaryPhoto}" alt="${conv.profile.name}" class="conv-avatar">
              ${conv.profile.isOnline ? '<div class="conv-online-dot"></div>' : ''}
            </div>
            <div class="conv-info">
              <div class="conv-name">
                ${conv.profile.name}
                <span class="conv-time">${conv.time}</span>
              </div>
              <div class="conv-preview">${conv.lastMsg}</div>
            </div>
            ${conv.unread > 0 ? `<span class="conv-unread">${conv.unread}</span>` : ''}
          </div>
        `).join('');
      }

      window.openConversation = (id) => {
        activeConvId = id;
        const conv = conversations.find(c => c.id === id);
        conv.unread = 0;
        document.getElementById('chat-empty').style.display = 'none';
        const chatActive = document.getElementById('chat-active');
        chatActive.style.display = 'flex';

        document.getElementById('chat-header').innerHTML = `
          <img src="${conv.profile.primaryPhoto}" alt="" class="chat-header-avatar">
          <div>
            <div class="chat-header-name">${conv.profile.name}</div>
            <div class="chat-header-status">${conv.profile.isOnline ? '<span class="online-pulse"></span> Online' : 'Last seen recently'}</div>
          </div>
          <div class="chat-header-actions">
            <a href="profile.html?id=${conv.profile.id}" class="chat-icon-btn" title="View profile">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
          </div>
        `;

        const messagesEl = document.getElementById('chat-messages');
        messagesEl.innerHTML = `<div class="chat-date-sep">Today</div>` + conv.messages.map(m => `
          <div class="message ${m.sent ? 'sent' : 'received'}">
            ${!m.sent ? `<img src="${conv.profile.primaryPhoto}" alt="" class="msg-avatar">` : ''}
            <div>
              <div class="msg-bubble">${m.text}</div>
              <div class="msg-time">${m.time}</div>
            </div>
          </div>
        `).join('');
        messagesEl.scrollTop = messagesEl.scrollHeight;
        renderConversations();
      };

      document.getElementById('chat-send').addEventListener('click', () => {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !activeConvId) return;
        const conv = conversations.find(c => c.id === activeConvId);
        conv.messages.push({ sent: true, text, time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) });
        conv.lastMsg = text;
        openConversation(activeConvId);
        input.value = '';
      });

      document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('chat-send').click(); }
      });

      renderConversations();
    });
  </script>
</body>
</html>
